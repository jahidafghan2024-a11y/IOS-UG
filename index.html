<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOS UG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Background Video -->
    <video id="bg-video" muted loop playsinline>
        <source src="assets/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <!-- Click to Play Overlay with IOS UG Branding -->
    <div id="play-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); display: flex; justify-content: center; align-items: center; z-index: 999; cursor: pointer; overflow: hidden;">
        <!-- Animated background elements -->
        <div style="position: absolute; top: -50%; right: -10%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(100, 200, 255, 0.1) 0%, transparent 70%); border-radius: 50%; animation: float 6s ease-in-out infinite;"></div>
        <div style="position: absolute; bottom: -30%; left: -5%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(100, 150, 255, 0.08) 0%, transparent 70%); border-radius: 50%; animation: float 8s ease-in-out infinite reverse;"></div>
        
        <!-- Main Content -->
        <div style="text-align: center; position: relative; z-index: 10; animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
            <!-- IOS UG Logo/Text -->
            <div style="margin-bottom: 50px;">
                <h1 style="color: white; font-size: 64px; font-weight: 900; margin: 0; letter-spacing: 3px; text-shadow: 0 10px 40px rgba(100, 200, 255, 0.3); animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);">IOS UG</h1>
                <div style="height: 4px; width: 80px; background: linear-gradient(90deg, #64c8ff, #6ba8ff); margin: 15px auto; border-radius: 2px; animation: expandWidth 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;"></div>
            </div>
            
            <!-- Play Button -->
            <div style="width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, rgba(100, 200, 255, 0.2) 0%, rgba(107, 168, 255, 0.15) 100%); backdrop-filter: blur(20px); display: flex; justify-content: center; align-items: center; margin: 0 auto 50px; border: 2px solid rgba(100, 200, 255, 0.3); animation: pulse 2s infinite; cursor: pointer;">
                <svg width="70" height="70" viewBox="0 0 24 24" fill="white" style="margin-left: 8px; animation: playBounce 1.5s ease-in-out infinite;">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
            
            <!-- Text -->
            <h2 style="color: white; font-size: 32px; margin: 0 0 15px 0; font-weight: 700; text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);"></h2>
            <p style="color: rgba(255, 255, 255, 0.7); font-size: 16px; margin: 0; letter-spacing: 1px; text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);"></p>
        </div>
    </div>
    
    <!-- Loading Indicator -->
    <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 50;">
        <div style="color: white; font-size: 18px;">Loading video...</div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="glass-card">
            
            <!-- Profile Picture -->
            <div class="profile-pic-wrapper">
                <img src="assets/profile.png" alt="IOS UG" class="profile-pic">
            </div>

            <!-- Name -->
            <h1 class="name">IOS UG</h1>

            <!-- Links -->
            <div class="links">
                <a href="https://t.me/UGios" target="_blank" class="link-btn">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.161.161-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.461c.54-.203 1.011.131.832 1.008z"/>
                    </svg>
                    Telegram
                </a>
                
                <a href="https://ios-underground.web.app/index.html" target="_blank" class="link-btn">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Website
                </a>
                
                <a href="https://youtube.com/@ios-ug?si=D1FcDKqsdOp7hhgS" target="_blank" class="link-btn">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    YouTube
                </a>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
